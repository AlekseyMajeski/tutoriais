name: Download link audit

on:
  push:
    paths:
      - 'scripts/audit-download-links.mjs'
      - '.github/workflows/download-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify driver links
        run: node scripts/audit-download-links.mjs
