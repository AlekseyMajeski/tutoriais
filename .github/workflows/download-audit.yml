name: Download link audit

on:
  push:
    paths:
      - 'impressoras-termicas/**/index.html'
      - 'scripts/audit-download-links.mjs'
      - '.github/workflows/download-audit.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Upgrade official download sources'
    types:
      - completed

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify driver links
        run: node scripts/audit-download-links.mjs
