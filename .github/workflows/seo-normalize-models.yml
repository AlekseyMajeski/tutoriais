name: SEO normalize model metadata

on:
  push:
    paths:
      - '.github/workflows/seo-normalize-models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize model metadata
        run: node scripts/normalize-model-seo.mjs

      - name: Audit normalized tree
        env:
          STRICT_SEO: '1'
        run: node scripts/audit-seo.mjs

      - name: Commit normalized model pages
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add impressoras-termicas
          git commit -m 'seo: fecha metadados restantes dos modelos'
          git push origin HEAD:main
