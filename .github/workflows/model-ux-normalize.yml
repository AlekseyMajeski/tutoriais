name: Normalize model UX loader

on:
  push:
    paths:
      - '.github/workflows/model-ux-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Normalize model UX loader
        run: node scripts/normalize-model-ux.mjs

      - name: Audit model UX
        run: node scripts/audit-model-ux.mjs

      - name: Commit normalized model pages
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add impressoras-termicas
          git commit -m 'ux: carrega normalizador em todas as páginas de modelo'
          git push origin HEAD:main
