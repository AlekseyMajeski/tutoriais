name: Sync model sitemap

on:
  push:
    paths:
      - 'impressoras-termicas/*/*/index.html'
      - 'scripts/sync-sitemap-models.mjs'
      - '.github/workflows/sitemap-model-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync sitemap
        run: node scripts/sync-sitemap-models.mjs

      - name: Audit SEO
        env:
          STRICT_SEO: '1'
        run: node scripts/audit-seo.mjs

      - name: Commit sitemap
        run: |
          if git diff --quiet sitemap.xml; then
            echo 'No sitemap changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'seo: sincroniza sitemap com modelos publicados'
          git pull --rebase origin main
          git push origin HEAD:main
