name: Sync model sitemap

on:
  push:
    paths:
      - 'impressoras-termicas/*/*/index.html'
      - 'scripts/sync-sitemap-models.mjs'
      - '.github/workflows/sitemap-model-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-sitemap-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Align with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Sync sitemap
        run: node scripts/sync-sitemap-models.mjs

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet sitemap.xml; then
            echo 'No sitemap changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'seo: sincroniza sitemap com modelos publicados'

      - name: Rebase and complete sync
        run: |
          git pull --rebase origin main
          node scripts/sync-sitemap-models.mjs
          if ! git diff --quiet sitemap.xml; then
            git add sitemap.xml
            git commit -m 'seo: completa sincronização do sitemap'
          fi

      - name: Audit final SEO state
        env:
          STRICT_SEO: '1'
        run: node scripts/audit-seo.mjs

      - name: Push sitemap commit
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'Nothing to push.'
            exit 0
          fi
          git push origin HEAD:main
